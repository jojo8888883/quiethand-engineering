<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuietHand · 30条手物结果</title>
<style>
:root{color-scheme:light;--ink:#182b36;--muted:#62727c;--line:#dbe3e7;--blue:#1764ad}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#eef3f5;font:15px/1.6 system-ui,sans-serif}header{padding:25px 4vw;background:#18333f;color:white}h1{margin:0;font-size:28px}header p{margin:7px 0;color:#d0dfe6;max-width:1080px}a{color:var(--blue)}header a{color:#96d5ff}button,select,textarea,input{font:inherit}button,select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}button{cursor:pointer}button.active{background:var(--blue);color:white}button:disabled{opacity:.45;cursor:default}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:#fff;z-index:2;padding:12px 4vw;border-bottom:1px solid var(--line)}.toolbar select{max-width:45vw}.counter{margin-left:auto;color:var(--muted)}main{max-width:1540px;margin:auto;padding:22px}section{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}h2{margin:0 0 10px;font-size:21px}h3{margin:6px 0}p{margin:6px 0 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.video{background:#0c1820;width:100%;max-height:400px;border-radius:8px}.muted,small{color:var(--muted)}.callout{padding:12px;background:#f1f6fa;border-radius:8px;margin-bottom:12px}.old{background:#fff8e7;padding:12px;border-radius:8px}.geometry img{width:100%;display:block;border-radius:6px;background:#182630}.geometry label{font-weight:700;display:block;margin-bottom:5px}.slider{display:flex;gap:15px;align-items:center;margin:14px 0}.slider input{flex:1}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}.dot{width:10px;height:10px;display:inline-block;border:1px solid #7d8990;border-radius:50%;margin-right:5px}.pair{border:1px solid var(--line);border-radius:9px;padding:12px;margin:10px 0}.pair p{margin:3px 0}.chart{width:100%;height:76px}.review{border:2px solid #b0ccd9}textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0}.actions{display:flex;gap:9px}.identity{display:grid;grid-template-columns:1fr 1fr;gap:15px}.identity img{width:100%;max-height:230px;object-fit:contain;border:1px solid var(--line)}summary{cursor:pointer;color:var(--blue)}details{margin:10px 0}code{font-size:12px;overflow-wrap:anywhere}.notice{color:#ac4625}.empty{padding:50px;text-align:center}.status{font-weight:600}.metrics{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.metrics span{border:1px solid #627880;border-radius:6px;padding:5px 10px}.navlabel{font-weight:700}@media(max-width:800px){.two,.identity{grid-template-columns:1fr}.counter{margin-left:0}main{padding:12px}section{padding:14px}.toolbar select{max-width:100%}h1{font-size:23px}}
</style></head><body>
<header><h1>QuietHand：30条手物结果，直接看改对没有</h1><p>先看原视频和千问描述，再看同一帧的手网格、物体 CAD 投影与位姿。此次检查物体身份，复用正确轨迹，只重算错配项；语义、手部模型和分割没有重跑。</p><p><a href="../../fusion_preview/index.html" target="_blank">原融合页与原评语</a> · <a href="../../../m3_v1_2/correction_review/index.html" target="_blank">原中文纠错页</a> · <a href="data.json" download>下载结构化结果</a></p><div id="metrics" class="metrics"></div></header>
<div class="toolbar"><button id="prev">← 上一条</button><select id="choose" aria-label="选择视频"></select><button id="next">下一条 →</button><span class="counter" id="progress"></span><button id="export">导出本轮评语</button><button id="import">导入本轮存档</button><input id="import-file" type="file" accept=".json,application/json" hidden></div>
<main id="root"><div class="empty">正在读取结果……</div></main>
<script>
const KEY='quiethand-m3-5-identity-batch-review-v1', OLD_KEY='quiethand-m3-5-fusion-review-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readStore=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return {}}};
let reviews=readStore(KEY),previous=readStore(OLD_KEY),data,records=[],selected=0,sample=0;
const root=document.querySelector('#root'),choice=document.querySelector('#choose');
const decisionZh=d=>({ok:'OK',bad:'不行',other:'其他',unreviewed:'未评'}[d]||'未评');
const stateZh=s=>({maintained_close:'多次持续靠近',boundary_near:'较近，但没达到持续靠近条件',not_close:'没达到持续靠近条件',abstain:'输入不齐，无法判断'}[s]||s);
const cm=v=>v==null?'未获得':(v*100).toFixed(1)+'厘米';
const originZh=s=>({rerun_pose:'本次重算',reused_existing_pose:'沿用原轨迹',reused_first_repair:'沿用首条修复',existing_unavailable:'原轨迹未获得',rerun_failed:'本次估计未成功'}[s]||'未获得');
function chart(p,frames){const max=Math.max(.06,...p.distance_m.filter(v=>v!=null)),first=frames[0],span=Math.max(1,frames.at(-1)-first);let runs=[],run=[];p.distance_m.forEach((v,i)=>{if(v==null){if(run.length)runs.push(run);run=[]}else run.push([10+380*(frames[i]-first)/span,62-52*v/max])});if(run.length)runs.push(run);return `<svg class="chart" viewBox="0 0 400 80" role="img" aria-label="按实际采样时刻绘制的手物距离"><line x1="10" x2="390" y1="${62-52*.03/max}" y2="${62-52*.03/max}" stroke="#cba249" stroke-dasharray="4 3"/>${runs.map(r=>`<polyline points="${r.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#2677aa" stroke-width="2"/>${r.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2" fill="#2677aa"/>`).join('')}`).join('')}<text x="10" y="78" font-size="11">${(first/30).toFixed(2)}秒</text><text x="340" y="78" font-size="11">${(frames.at(-1)/30).toFixed(2)}秒</text></svg>`}
function pairText(p){const c=p.contact,rel=p.relative_motion;if(p.status==='abstain')return '这组手物关系暂时无法判断：必要的手、物体区域或姿态没有获得。';return `15个采样点中，${c.close_frame_count}个距离不超过3厘米，最长连续满足${c.longest_close_run}个采样点。${rel?`手相对物体的运动跨度为${cm(rel.diagonal_span_m)}${rel.stable_with_object?'，满足当前5厘米稳定随物规则':'，未满足当前5厘米稳定随物规则'}。`:''}`}
function handBlock(side,r){const h=r.hands[side],name=side==='left'?'左手':'右手',f=h.fusion;let desc=f.geometry_role==='undetermined'?'几何暂时没给出明确角色，保留千问原描述。':f.relation==='conflict'?'几何候选与千问原描述有冲突，暂不自动定角色。':'几何规则产生了角色候选，可结合下方证据检查。';return `<div><h3>${name}</h3><p>${desc}</p>${['tool','target'].map(role=>{const p=h.pairs[role];return `<div class="pair"><b>${name} ↔ ${esc(r.semantic[role+'_zh'])}</b><p class="status">${esc(stateZh(p.contact.state))}</p><p>${pairText(p)}</p>${chart(p,r.source_frame_indices)}<small>曲线是距离；横轴是原视频时间，虚线为3厘米。跨采样点连线只辅助阅读，不是中间帧测量。</small><details><summary>近接采样段与数值</summary><p>${p.close_sample_spans.length?p.close_sample_spans.map(s=>`${(s.first_frame/30).toFixed(2)}–${(s.last_frame/30).toFixed(2)}秒（${s.sample_count}个采样点）`).join('；'):'没有距离≤3厘米的采样点'}</p><p>这里只报告采样点及其时间跨度，不代表区间内每一帧都接触。最短距离：${cm(p.contact.minimum_distance_m)}；中位距离：${cm(p.contact.median_distance_m)}。</p>${p.failure_reason?`<code>${esc(p.failure_reason)}</code>`:''}</details></div>`}).join('')}</div>`}
function render(){const r=records[selected],rev=reviews[r.event_id]||{},prev=previous[r.event_id];sample=0;root.innerHTML=`<section class="two"><div><h2>${selected+1} / ${records.length} · ${esc(r.semantic.action_zh)}</h2><video id="video" class="video" src="${r.video_url}" controls playsinline preload="metadata"></video><p class="muted">完整原视频，可正常播放；下方几何只在动作区间内取15个采样点。</p></div><div><h2>模型认为发生了什么</h2><div class="callout">${esc(r.semantic.sentence_zh)}</div><details><summary>千问原始英文（核对翻译）</summary><p>动作：${esc(r.semantic.action_original)}<br>物体A：${esc(r.semantic.tool_original)}<br>物体B：${esc(r.semantic.target_original)}</p></details><div class="old"><b>你原来的语义审核：${decisionZh(r.human_review.decision)}</b><p>${esc(r.human_review.correction_text||'未填写纠错文字')}</p>${prev?`<b>你在原融合页的意见：${decisionZh(prev.decision)}</b><p>${esc(prev.comment_text||'')}</p>`:''}<small>旧意见只作对照，未参与本次匹配和计算，也不会被本轮意见覆盖。</small></div><p><code>${esc(r.event_id)}</code></p></div></section>
<section class="geometry"><h2>同一时刻：手和物体到底对上了吗？</h2><p>点是手网格顶点与物体 CAD 的投影，不是真值。短坐标轴表示估计姿态（红x、绿y、蓝z）；前后同一物体始终同色，手部结果相同。</p><div class="legend"><span><i class="dot" style="background:#00d9ed"></i>左手</span><span><i class="dot" style="background:#cd8bff"></i>右手</span>${Object.entries(r.entity_colors).map(([id,c])=>`<span><i class="dot" style="background:${c}"></i>${esc(id)}</span>`).join('')}</div><div class="slider"><button id="sample-prev">←</button><input id="sample" aria-label="几何采样帧" type="range" min="0" max="14" value="0"><button id="sample-next">→</button><span id="sample-label"></span><button id="seek">原视频跳到这里</button></div><div class="two"><div><label>修复前</label><img id="before" alt="修复前手网格和物体姿态投影"></div><div><label>身份检查后</label><img id="after" alt="身份检查后手网格和物体姿态投影"></div></div><details><summary>物体配对详情：有没有换错？</summary>${r.identities.map(i=>`<div class="pair"><b>${esc(i.name_zh)}</b>：${esc(i.before)} → ${esc(i.after||'未确认身份')} · ${originZh(i.pose_origin)}<div class="identity"><figure><img src="${i.crop_url}" alt="模型所见原始物体区域"><figcaption>匹配时看到的RGB区域</figcaption></figure>${i.cad_url?`<figure><img src="${i.cad_url}" alt="配对的CAD多视图"><figcaption>配对的CAD多视图</figcaption></figure>`:'<p>没有明确匹配，未生成新姿态。</p>'}</div><small>模型匹配理由：${esc(i.reason||'未提供')}</small>${i.failure_reason?`<p class="notice">未获得原因：${esc(i.failure_reason)}</p>`:''}</div>`).join('')}</details></section>
<section><h2>几何比“一段话”多告诉了什么？</h2><p>这里给出每只手靠近哪个物体、在什么采样时刻靠近、相对运动有多大。距离与相对跨度来自模型几何；它们还不能直接证明“真接触”或“在支撑”。</p><div class="two">${handBlock('left',r)}${handBlock('right',r)}</div><details><summary>本轮保持不变的判定规则</summary><p>持续近接：至少8/15个采样点≤3厘米，并且连续满足至少4个采样点。边界近接：未满足前者，但至少8/15个采样点≤6厘米。稳定随物：手网格中心在物体坐标系里的5%–95%位置范围，对角长度≤5厘米。相对跨度包含真实动作，不是抖动误差。当前仅为30条校准视频，未打开评估集。</p></details></section>
<section class="review"><h2>这条结果，你觉得怎么样？</h2><p>核心动作或物体配错可选“不行”；颜色、措辞等小问题可选“其他”，写清楚即可。也可以不打分，直接写你看到了什么。</p><div class="actions">${['ok','bad','other'].map(d=>`<button data-decision="${d}">${decisionZh(d)}</button>`).join('')}</div><textarea id="comment" aria-label="本条评语" placeholder="比如：碗现在对上了，但右手还是飘；这里是在舀，不是在搅拌。">${esc(rev.comment_text||'')}</textarea><p id="saved" class="muted"></p><small>自动保存到当前浏览器；换浏览器或清缓存前，请点顶部“导出本轮评语”。</small></section>`;
document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>save(b.dataset.decision));document.querySelector('#comment').oninput=()=>save((reviews[r.event_id]||{}).decision);document.querySelector('#sample').oninput=e=>{sample=+e.target.value;showSample()};document.querySelector('#sample-prev').onclick=()=>{sample=Math.max(0,sample-1);showSample()};document.querySelector('#sample-next').onclick=()=>{sample=Math.min(14,sample+1);showSample()};document.querySelector('#seek').onclick=()=>{document.querySelector('#video').currentTime=r.source_frame_indices[sample]/30};choice.value=selected;document.querySelector('#prev').disabled=selected===0;document.querySelector('#next').disabled=selected===records.length-1;showSample();updateReview();}
function showSample(){const r=records[selected],name=String(sample).padStart(2,'0');document.querySelector('#before').src=`frames/${r.event_id}/${name}_before.jpg`;document.querySelector('#after').src=`frames/${r.event_id}/${name}_after.jpg`;document.querySelector('#sample').value=sample;document.querySelector('#sample-label').textContent=`${sample+1}/15 · ${(r.source_frame_indices[sample]/30).toFixed(2)}秒 · 原帧${r.source_frame_indices[sample]}`;}
function save(decision){const r=records[selected];reviews[r.event_id]={event_id:r.event_id,decision:decision||'unreviewed',comment_text:document.querySelector('#comment').value};try{localStorage.setItem(KEY,JSON.stringify(reviews));updateReview()}catch{document.querySelector('#saved').textContent='浏览器未能保存，请立即导出评语存档。'}}
function updateReview(){const rev=reviews[records[selected].event_id]||{};document.querySelectorAll('[data-decision]').forEach(b=>{const active=b.dataset.decision===rev.decision;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelector('#saved').textContent=(rev.decision||rev.comment_text)?`已保存：${decisionZh(rev.decision)}${rev.comment_text?' · 含评语':''}`:'还没有本轮意见；原意见仍然保留。';document.querySelector('#progress').textContent=`本轮已评 ${records.filter(r=>['ok','bad','other'].includes(reviews[r.event_id]?.decision)).length}/${records.length}`;}
choice.onchange=()=>{selected=+choice.value;render()};document.querySelector('#prev').onclick=()=>{selected--;render()};document.querySelector('#next').onclick=()=>{selected++;render()};
document.querySelector('#export').onclick=()=>{const output={format:'quiethand-m3-5-identity-batch-review',version:1,exported_at:new Date().toISOString(),items:records.map(r=>reviews[r.event_id]||{event_id:r.event_id,decision:'unreviewed',comment_text:''})};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));a.download='quiethand-m3-5-identity-batch-review-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.querySelector('#import').onclick=()=>document.querySelector('#import-file').click();document.querySelector('#import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const input=JSON.parse(await file.text());if(input.format!=='quiethand-m3-5-identity-batch-review'||!Array.isArray(input.items))throw Error('请选择本轮网页导出的存档');const ids=new Set(records.map(r=>r.event_id));if(input.items.some(r=>!ids.has(r.event_id)||!['ok','bad','other','unreviewed'].includes(r.decision)||typeof r.comment_text!=='string'))throw Error('存档条目与本批次不匹配');const populated=input.items.filter(r=>r.decision!=='unreviewed'||r.comment_text);const conflicts=populated.filter(r=>reviews[r.event_id]&&JSON.stringify(reviews[r.event_id])!==JSON.stringify(r));if(conflicts.length&&!confirm(`有${conflicts.length}条本轮意见不同，用存档里的意见替换它们吗？`))return;for(const r of populated)reviews[r.event_id]=r;localStorage.setItem(KEY,JSON.stringify(reviews));render()}catch(err){alert('未导入：'+err.message)}e.target.value=''};
fetch('data.json').then(r=>{if(!r.ok)throw Error('结果文件无法读取');return r.json()}).then(d=>{data=d;records=d.records;choice.innerHTML=records.map((r,i)=>`<option value="${i}">${i+1}. ${esc(r.semantic.action_zh)} · ${esc(r.semantic.tool_zh)} / ${esc(r.semantic.target_zh)}</option>`).join('');const c=d.poses.execution_counts;document.querySelector('#metrics').innerHTML=`<span>${records.length}条校准视频</span><span>${c.rerun_pose}条物体轨迹重算</span><span>${c.reused_existing_pose+c.reused_first_repair}条轨迹复用</span><span>${c.abstain+c.invalid}条姿态未获得</span>`;render()}).catch(e=>root.innerHTML=`<p class="notice">结果未加载：${esc(e.message)}。请通过本地HTTP网页打开，不要直接双击HTML文件。</p>`);
</script></body></html>
